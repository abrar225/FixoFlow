name: Portable core
on:
  push:
    paths: ['fixoflow/**', 'tests/**', 'pyproject.toml', '.github/workflows/portable-core.yml']
  pull_request:
    paths: ['fixoflow/**', 'tests/**', 'pyproject.toml', '.github/workflows/portable-core.yml']
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable test dependencies
        run: python -m pip install pytest numpy scipy
      - name: Test shared contracts without native UI or a speech model
        run: python -m pytest tests/test_config.py tests/test_startup.py tests/test_controls.py tests/test_updates.py tests/test_learner_and_db.py tests/test_polisher.py tests/test_audio_filter.py tests/test_audio_slicer.py tests/test_languages.py tests/test_session_deletion.py tests/test_stt.py tests/test_app_scope.py tests/test_models_lifecycle.py tests/test_checkup.py tests/test_appearance.py tests/test_benchmark_comparison.py tests/test_session_memory.py tests/test_evaluation.py tests/test_devices_and_playback.py -q
      - name: Test the Windows decoder contract
        if: runner.os != 'macOS'
        run: python -m pytest tests/test_cpu_stt.py -q
