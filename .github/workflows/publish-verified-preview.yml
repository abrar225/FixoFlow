name: Attach verified preview installers
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Desktop preview packages run ID
        required: true
      build_sha:
        description: Full source commit used by that run
        required: true
      version:
        description: Existing draft release version, without v
        required: true
      windows_sha256:
        description: Verified Windows installer SHA-256
        required: false
      linux_sha256:
        description: Verified Linux installer SHA-256
        required: false
      inspect_only:
        description: Inspect saved artifacts and emit hashes without attaching files
        type: boolean
        default: false
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      BUILD_SHA: ${{ inputs.build_sha }}
      VERSION: ${{ inputs.version }}
      WINDOWS_HASH: ${{ inputs.windows_sha256 }}
      LINUX_HASH: ${{ inputs.linux_sha256 }}
      INSPECT_ONLY: ${{ inputs.inspect_only }}
    steps:
      - name: Require a successful exact-source native build and matching draft
        shell: bash
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$BUILD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$INSPECT_ONLY" != "true" ]]; then
            [[ "$WINDOWS_HASH" =~ ^[a-f0-9]{64}$ ]]
            [[ "$LINUX_HASH" =~ ^[a-f0-9]{64}$ ]]
          fi
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" | jq -e --arg sha "$BUILD_SHA" '.conclusion == "success" and .head_sha == $sha and .path == ".github/workflows/desktop-preview.yml"'
          gh api "repos/$GH_REPO/releases?per_page=100" | jq -e --arg tag "v$VERSION" --arg sha "$BUILD_SHA" 'any(.[]; .tag_name == $tag and .draft == true and .target_commitish == $sha)'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: windows-preview
          path: windows
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: linux-preview
          path: linux
      - name: Inspect installer formats and native UI/inference reports
        shell: bash
        run: |
          jq -e --arg version "$VERSION" '.version == $version and .platform == "win32" and .ui == "ok" and .local_inference == "executed"' windows/build/self-check.json
          jq -e --arg version "$VERSION" '.version == $version and .platform == "linux" and .ui == "ok" and .local_inference == "executed"' linux/build/self-check.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ['VERSION']
          result = {'build_run': os.environ['BUILD_RUN'], 'source_commit': os.environ['BUILD_SHA'], 'version': version, 'files': []}
          for platform, suffix, magic in [('windows', 'windows-x64-setup.exe', b'MZ'), ('linux', 'linux-x64.deb', b'!<arch>\n')]:
              path = Path(platform) / 'dist' / f'Fixoflow-{version}-{suffix}'
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  assert stream.read(len(magic)) == magic, f'Unexpected installer format: {path}'
                  stream.seek(0)
                  while chunk := stream.read(1024 * 1024):
                      digest.update(chunk)
              result['files'].append({'name': path.name, 'bytes': path.stat().st_size, 'sha256': digest.hexdigest(), 'platform': platform, 'report': json.loads((Path(platform) / 'build/self-check.json').read_text())})
          Path('native-preview-manifest.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.inspect_only
        with:
          name: native-preview-inspection
          path: native-preview-manifest.json
          if-no-files-found: error
      - name: Verify previously inspected installer hashes
        if: ${{ !inputs.inspect_only }}
        shell: bash
        run: |
          echo "$WINDOWS_HASH  windows/dist/Fixoflow-$VERSION-windows-x64-setup.exe" | sha256sum -c -
          echo "$LINUX_HASH  linux/dist/Fixoflow-$VERSION-linux-x64.deb" | sha256sum -c -
      - name: Attach exact files without overwriting existing assets
        if: ${{ !inputs.inspect_only }}
        run: gh release upload "v$VERSION" "windows/dist/Fixoflow-$VERSION-windows-x64-setup.exe" "linux/dist/Fixoflow-$VERSION-linux-x64.deb"
