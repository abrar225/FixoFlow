<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixoflow floating control</title>
<style>
*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;display:grid;place-items:center;background:transparent;overflow:hidden;color:#f9f9f7;font:12px -apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;user-select:none;-webkit-user-select:none}
.bar{height:44px;max-width:306px;display:flex;align-items:center;padding:4px;gap:1px;border-radius:25px;background:rgba(23,23,25,.96);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 16px #0003,inset 0 1px #ffffff0d}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;border-radius:20px;height:34px;display:flex;align-items:center;justify-content:center}button:hover{background:#ffffff12}button:focus-visible{outline:2px solid #c9b9f2;outline-offset:1px}button:disabled{cursor:wait;opacity:.75}
.main{gap:9px;padding:0 12px 0 10px;min-width:166px;justify-content:flex-start}.icon{width:20px;height:20px;display:grid;place-items:center;flex-shrink:0}.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.label{white-space:nowrap;max-width:154px;overflow:hidden;text-overflow:ellipsis;font-weight:500}.key{font-size:10px;color:#b7b7bb;padding-left:5px;white-space:nowrap}.utility{width:33px;flex-shrink:0}.utility svg{width:15px;height:15px;stroke:#b7b7bb;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.divider{height:16px;width:1px;background:#ffffff18;margin:0 2px}
.wave{height:19px;width:20px;gap:2px;align-items:center;display:none;--level:0}.wave i{width:2px;height:5px;border-radius:2px;background:#fff;transform:scaleY(calc(1 + var(--level)*3));transition:transform .08s}.wave i:nth-child(2),.wave i:nth-child(4){height:9px}.wave i:nth-child(3){height:13px}
[data-state=listening] .main{background:#ffffff0c}[data-state=listening] .mic{display:none}[data-state=listening] .wave{display:flex}[data-state=listening] .key{color:#e6b0aa}.spinner{display:none;width:15px;height:15px;border:1.5px solid #ffffff40;border-top-color:#fff;border-radius:50%;animation:spin .85s linear infinite}[data-state=processing] .mic{display:none}[data-state=processing] .spinner{display:block}[data-state=success] .mic{color:#adceae}[data-state=error] .mic{color:#edb08f}.cancel{display:none}[data-state=listening] .cancel{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bar" id="bar" data-state="idle" role="group" aria-label="Fixoflow dictation controls">
<button id="toggle" class="main" aria-label="Start dictation" title="Click to start. Click again to stop and transcribe." onclick="post('toggle')">
<span class="icon"><svg class="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></span><span class="spinner"></span></span>
<span id="label" class="label" aria-live="polite">Click to dictate</span><span id="key" class="key">⌃ Space</span>
</button>
<button class="utility cancel" aria-label="Cancel recording" title="Cancel recording · audio is kept" onclick="post('cancel')"><svg viewBox="0 0 20 20"><path d="m6 6 8 8m0-8-8 8"/></svg></button>
<span class="divider"></span><button class="utility" aria-label="Open Fixoflow settings" title="Open Fixoflow" onclick="post('openHub')"><svg viewBox="0 0 20 20"><path d="M4 5h12M4 10h12M4 15h12"/><circle cx="7" cy="5" r="1.7" fill="#171719"/><circle cx="13" cy="10" r="1.7" fill="#171719"/><circle cx="8" cy="15" r="1.7" fill="#171719"/></svg></button>
</div>
<script>
let current='idle', started=0, clock=null;
function post(action){window.webkit?.messageHandlers?.fixoflow?.postMessage({action});}
function tick(){const elapsed=Math.max(0,Math.floor((Date.now()-started)/1000));document.getElementById('key').textContent=Math.floor(elapsed/60)+':'+String(elapsed%60).padStart(2,'0');}
function updateControl(data){
 const bar=document.getElementById('bar'),button=document.getElementById('toggle');
 bar.dataset.state=data.state;
 document.getElementById('label').textContent=data.state==='listening'?'Listening':data.message;
 button.disabled=data.state==='processing';
 button.setAttribute('aria-label',data.state==='listening'?'Stop dictation':data.state==='processing'?'Transcribing':'Start dictation');
 button.setAttribute('aria-pressed',String(data.state==='listening'));
 if(data.state==='listening'){
  if(current!=='listening'){started=Date.now()-(data.elapsed||0)*1000;clock=setInterval(tick,1000);}tick();
 }else{clearInterval(clock);clock=null;document.getElementById('key').textContent=data.state==='idle'?data.shortcut:'';setAudioLevel(0);}
 current=data.state;
}
function setAudioLevel(level){document.getElementById('wave').style.setProperty('--level',Math.min(1,Math.max(0,level)));}
window.addEventListener('DOMContentLoaded',()=>post('ready'));
</script>
</body>
</html>
