[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fixoflow"
dynamic = ["version"]
description = "Local voice dictation for macOS, Windows, and Linux"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
  { name = "Fixoflow Team" }
]
dependencies = [
  "sounddevice>=0.5.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pynput>=1.7.6",
  "onnx-asr[cpu]==0.12.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
  # PyObjC 13's CoreMedia wheel cannot load libswiftCoreMedia on the macOS 15 Intel runner.
  "pyobjc-core==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-UserNotifications==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-ServiceManagement==12.2.2; sys_platform == 'darwin'"
]

[project.urls]
Homepage = "https://fixoflow.tech"
Repository = "https://github.com/abrar225/FixoFlow"
Issues = "https://github.com/abrar225/FixoFlow/issues"

[project.scripts]
fixoflow = "fixoflow.cli:main"

[tool.setuptools.dynamic]
version = {attr = "fixoflow.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["fixoflow*"]

[project.optional-dependencies]
windows = ["faster-whisper>=1.1,<2; sys_platform == 'win32'", "pywebview>=5,<7; sys_platform == 'win32'", "pystray==0.19.5; sys_platform == 'win32'", "Pillow>=10,<13; sys_platform == 'win32'"]
linux = ["faster-whisper>=1.1,<2; sys_platform == 'linux'", "pywebview>=5,<7; sys_platform == 'linux'", "pystray==0.19.5; sys_platform == 'linux'", "Pillow>=10,<13; sys_platform == 'linux'"]
packaging = ["pyinstaller==6.20.0"]
dev = ["pytest>=8,<10"]

[tool.setuptools.package-data]
"fixoflow.ui" = ["*.html", "*.css", "assets/*"]
